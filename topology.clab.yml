name: netforge-a3
topology:
  nodes:
    core:
      kind: linux
      image: quay.io/frrouting/frr:10.2.1
      binds:
        - configs/core/frr.conf:/etc/frr/frr.conf:ro
        - configs/core/daemons:/etc/frr/daemons:ro
    gateway:
      kind: linux
      image: soc-gateway:local
      binds:
        - configs/gateway/bootstrap.sh:/bootstrap.sh:ro
        - configs/gateway/nftables.conf:/etc/nftables.conf:ro
      exec:
        - sh /bootstrap.sh
    sensor:
      kind: linux
      image: jasonish/suricata:7.0.8
      binds:
        - services/suricata.yaml:/etc/suricata/suricata.yaml:ro
        - detections/suricata.rules:/var/lib/suricata/rules/suricata.rules:ro
        - evidence:/var/log/suricata
      cmd: "-c /etc/suricata/suricata.yaml --af-packet -vv"
    management:
      kind: linux
      image: alpine:3.20
      exec: ["ip address add 10.81.10.10/27 dev eth1", "ip route replace default via 10.81.10.1"]
    finance:
      kind: linux
      image: alpine:3.20
      exec: ["ip address add 10.81.20.10/26 dev eth1", "ip route replace default via 10.81.20.1"]
    engineering:
      kind: linux
      image: alpine:3.20
      exec: ["ip address add 10.81.30.10/25 dev eth1", "ip route replace default via 10.81.30.1"]
    users:
      kind: linux
      image: alpine:3.20
      exec: ["ip address add 10.81.40.10/24 dev eth1", "ip route replace default via 10.81.40.1"]
    servers:
      kind: linux
      image: alpine:3.20
      exec: ["ip address add 10.81.50.10/27 dev eth1", "ip route replace default via 10.81.50.1"]
    dmz:
      kind: linux
      image: alpine:3.20
      exec: ["ip address add 10.81.60.10/28 dev eth1", "ip route replace default via 10.81.60.1"]
    guest:
      kind: linux
      image: alpine:3.20
      exec: ["ip address add 10.81.70.10/24 dev eth1", "ip route replace default via 10.81.70.1"]
  links:
    - endpoints: ["core:eth1", "gateway:eth1"]
    - endpoints: ["gateway:eth2", "management:eth1"]
    - endpoints: ["gateway:eth3", "finance:eth1"]
    - endpoints: ["gateway:eth4", "engineering:eth1"]
    - endpoints: ["gateway:eth5", "users:eth1"]
    - endpoints: ["gateway:eth6", "servers:eth1"]
    - endpoints: ["gateway:eth7", "dmz:eth1"]
    - endpoints: ["gateway:eth8", "guest:eth1"]
    - endpoints: ["gateway:eth9", "sensor:eth1"]