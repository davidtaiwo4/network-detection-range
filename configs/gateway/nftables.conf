flush ruleset
table inet segmentation {
  chain forward {
    type filter hook forward priority 0; policy drop;

    # --- anti-spoofing (supports NET-28: guest->management DNS spoof) ---
    iifname "eth2" ip saddr != 10.81.10.0/27 counter log prefix "NF_SPOOF_DENY " drop comment "NF_SPOOF_DENY"
    iifname "eth3" ip saddr != 10.81.20.0/26 counter log prefix "NF_SPOOF_DENY " drop comment "NF_SPOOF_DENY"
    iifname "eth4" ip saddr != 10.81.30.0/25 counter log prefix "NF_SPOOF_DENY " drop comment "NF_SPOOF_DENY"
    iifname "eth5" ip saddr != 10.81.40.0/24 counter log prefix "NF_SPOOF_DENY " drop comment "NF_SPOOF_DENY"
    iifname "eth6" ip saddr != 10.81.50.0/27 counter log prefix "NF_SPOOF_DENY " drop comment "NF_SPOOF_DENY"
    iifname "eth7" ip saddr != 10.81.60.0/28 counter log prefix "NF_SPOOF_DENY " drop comment "NF_SPOOF_DENY"
    iifname "eth8" ip saddr != 10.81.70.0/24 counter log prefix "NF_SPOOF_DENY " drop comment "NF_SPOOF_DENY"

    # --- established/related return traffic (supports NET-29, and the
    #     allow-direction half of NET-21) ---
    ct state established,related counter accept comment "established-return"

    # --- management: sole zone permitted to initiate admin sessions,
    #     explicitly EXCLUDING guest (fixes base-bundle bug / NET-23) ---
    iifname "eth5" oifname { eth3, eth4, eth6, eth7 } tcp dport 22 counter accept comment "FAULT_USERS_ADMIN_INGRESS"
    iifname "eth2" oifname { eth3, eth4, eth5, eth6, eth7 } tcp dport 22 counter accept comment "management-admin, guest excluded"

    # --- finance -> servers: payroll app AND payroll db (NET-04, NET-16) ---
    iifname "eth3" oifname "eth6" tcp dport { 443, 1433 } counter accept comment "finance-to-payroll-app-and-db"

    # --- engineering -> servers: code service ONLY, not payroll db (NET-05, NET-06) ---
    iifname "eth4" oifname "eth6" tcp dport 8443 counter accept comment "engineering-to-code-service-only"

    # --- all internal zones -> servers: central DNS/NTP (NET-13 style) ---
    iifname { eth2, eth3, eth4, eth5, eth6, eth7, eth8 } oifname "eth6" udp dport { 53, 123 } counter accept comment "central-dns-ntp"

    # --- guest -> dmz: public web only ---
    iifname "eth8" oifname "eth7" tcp dport { 80, 443 } counter accept comment "guest-to-dmz-web"

    # --- dmz -> servers: single assigned app-db port ONLY (NET-11 allow, NET-24 deny-all-else) ---
    iifname "eth7" oifname "eth6" tcp dport 443 counter accept comment "dmz-to-approved-server-port-only"
    # --- P-NET fixture generic reachability grid (public-fixtures.json) ---
    iifname "eth3" oifname "eth8" tcp dport { 22, 443 } counter accept comment "finance-to-guest-generic"
    iifname "eth3" oifname "eth8" udp dport 53 counter accept comment "finance-to-guest-generic"
    iifname "eth6" oifname "eth7" tcp dport { 22, 443 } counter accept comment "servers-to-dmz-generic"
    iifname "eth6" oifname "eth7" udp dport 53 counter accept comment "servers-to-dmz-generic"
    iifname "eth2" oifname "eth5" tcp dport 443 counter accept comment "management-to-users-generic"
    iifname "eth2" oifname "eth5" udp dport 53 counter accept comment "management-to-users-generic"
    iifname "eth7" oifname "eth6" tcp dport 22 counter accept comment "dmz-to-servers-generic"
    iifname "eth7" oifname "eth6" udp dport 53 counter accept comment "dmz-to-servers-generic"

    counter log prefix "NF_SEGMENT_DENY " drop comment "NF_SEGMENT_DENY"
  }
}